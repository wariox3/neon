<svg xmlns="http://www.w3.org/2000/svg" viewBox="49.31 3.05 38 38">
  <!--
    Isotipo del logo de RedEDoc, sin fondo. El trazo oxford desaparecería en una
    pestaña oscura, así que con el navegador en modo oscuro pasa a blanco. Va algo
    engrosado para que no se pierda a 16px.
  -->
